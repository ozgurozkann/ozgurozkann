name: Generate Snake

on:
  # Her 12 saatte bir otomatik çalışır
  schedule:
    - cron: "0 */12 * * *"
  
  # İstediğin zaman manuel olarak çalıştırabilmen için
  workflow_dispatch:
  
  # Ana dala push yapıldığında çalışır
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # GitHub katkı grafiğinden yılan oyunu animasyonunu üretir
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Üretilen SVG dosyalarını doğrudan gh-pages dalına yükler (Harici Token İstemez)
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
